name: Plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the Claude plugin and marketplace
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate .

      - name: Both manifests carry the same version
        run: |
          claude_version=$(jq -r .version plugins/lexagent/.claude-plugin/plugin.json)
          chatgpt_version=$(jq -r .version plugins/lexagent/plugin.json)
          echo "Claude $claude_version, ChatGPT $chatgpt_version"
          test "$claude_version" = "$chatgpt_version"

      - name: A release tag matches that version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(jq -r .version plugins/lexagent/plugin.json)"

      - name: Build the ChatGPT submission ZIP
        run: scripts/build-chatgpt-zip.sh

      - name: Attach the ZIP to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/lexagent-chatgpt-submission.zip --title "$GITHUB_REF_NAME" --generate-notes
